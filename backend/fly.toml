app = "raygpt-backend"
primary_region = "iad" # Cambiar a la región más cercana al desplegar

[build]
  dockerfile = "Dockerfile"

[env]
  # Configuración para usar el disco persistente
  DATABASE_URL = "sqlite+aiosqlite:////app/data/raygpt.db"
  REDIS_URL = "memory"
  PORT = "8080"
  # Variables de entorno adicionales se configuran con `fly secrets set`

[mounts]
  source = "raygpt_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false # Mantener encendido
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
