version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - raygpt_network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: raymundo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: raygpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - raygpt_network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - raygpt_network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - raygpt_network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  raygpt_network:
    driver: bridge\n